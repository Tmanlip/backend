# ASLAW Laravel API Nginx site config for Azure VM (Ubuntu)
# Place this at: /etc/nginx/sites-available/aslaw-api.conf
# Then symlink to: /etc/nginx/sites-enabled/aslaw-api.conf

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    root /var/www/aslaw-backend/public;
    index index.php index.html;

    client_max_body_size 25m;

    access_log /var/log/nginx/aslaw-api-access.log;
    error_log /var/log/nginx/aslaw-api-error.log;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        # Adjust PHP-FPM socket if your version differs.
        # Common alternatives:
        # - unix:/run/php/php8.2-fpm.sock
        # - unix:/run/php/php8.3-fpm.sock
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }
}
