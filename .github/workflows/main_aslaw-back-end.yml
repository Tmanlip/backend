# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - aslaw-back-end

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'aslaw-back-end'
          package: .

      - name: Set Laravel permissions and clear cache
        run: |
          echo "Make storage and bootstrap/cache writable"
          ssh ${{ secrets.AZURE_SSH_USER }}@${{ secrets.AZURE_SSH_HOST }} "chmod -R 775 /home/site/wwwroot/storage /home/site/wwwroot/bootstrap/cache"
          echo "Clear Laravel caches"
          ssh ${{ secrets.AZURE_SSH_USER }}@${{ secrets.AZURE_SSH_HOST }} "cd /home/site/wwwroot && php artisan config:clear && php artisan cache:clear && php artisan view:clear"
