name: Build PHP app - aslaw-back-end

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    env:
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      WEBAPP_NAME: ${{ secrets.WEBAPP_NAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_REPOSITORY: aslaw-backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress

      - name: Clear Config Cache
        run: php artisan config:clear && php artisan cache:clear && php artisan optimize:clear

      - name: Zip artifact for deployment
        run: zip -r release.zip . --exclude=".git/*" --exclude="*.github*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image metadata
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME_LATEST=${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:latest" >> "$GITHUB_ENV"

      - name: Build and push container image to ACR
        run: |
          if [[ "$ACR_LOGIN_SERVER" != *".azurecr.io" ]]; then
            echo "ACR_LOGIN_SERVER must be your Azure Container Registry login server (example: myregistry.azurecr.io)."
            echo "Current value looks non-ACR and may cause Docker Hub scope errors."
            exit 1
          fi

          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          az acr login --name "$ACR_NAME"
          echo "Logged in to Azure Container Registry: $ACR_LOGIN_SERVER"

          docker build \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE_NAME" \
            -t "$IMAGE_NAME_LATEST" \
            .

          docker push "$IMAGE_NAME"
          docker push "$IMAGE_NAME_LATEST"

      - name: Stamp deployed commit in app settings
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --settings APP_VERSION="$IMAGE_TAG" GIT_SHA="$GITHUB_SHA"

      - name: Update Web App container image (production)
        run: |
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --slot "staging" \
            --container-image-name "$IMAGE_NAME"

          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --slot "staging"

      - name: Verify deployed image tag
        run: |
          DEPLOYED_IMAGE=$(az webapp config container show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --query "linuxFxVersion" -o tsv)

          echo "Expected image: $IMAGE_NAME"
          echo "Configured image: $DEPLOYED_IMAGE"

          if [[ "$DEPLOYED_IMAGE" != *"$IMAGE_NAME"* ]]; then
            echo "Deployment verification failed: configured container image does not match commit tag."
            exit 1
          fi

